<pre id="out"></pre>

<script src="../src/model.js"></script>
<script src="../src/classifier.js"></script>
<script src="../src/core.js"></script>
<script src="../src/ui.js"></script>
<script>
(function () {
  var posts = LDSCore.extractPosts(document);
  var scored = posts.map(function (p) {
    p.result = LDSClassifier.score(p.text);
    var off = LDSClassifier.offensive(p.text);
    if (off && off.severe) { p.result.severe = true; p.result.score = Math.max(p.result.score, 60); }
    LDSUI.markPost(p, p.result);
    return { author: p.author, score: p.result.score, label: p.result.label };
  });
  var s = LDSCore.summarize(posts.map(function (p) {
    return { score: p.result.score, author: p.author, text: p.text, el: p.el };
  }));
  s.scored = posts.map(function (p) { return { score: p.result.score }; });
  LDSUI.mount(LDSUI.panel(s, { title: 'L站舆情 · 本主题' }));
  document.getElementById('out').textContent = JSON.stringify({
    extracted: posts.length,
    authors: posts.map(function (p) { return p.author; }),
    scored: scored,
    summary: { n: s.n, mean: s.mean, p90: s.p90, hot: s.hot, snark: s.snark },
    panel: !!document.getElementById('lds-panel'),
    chips: document.querySelectorAll('.lds-chip').length,
    hotPosts: document.querySelectorAll('.lds-hot-post').length
  });
})();
</script>
</body></html>
